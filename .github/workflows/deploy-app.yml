name: Deploy application

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment that approves the deployment"
        required: true
        type: choice
        options: [mvp, prod-reference]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'mvp' }}
    steps:
      - uses: actions/checkout@v4
      # MVP: Using Secret auth instead of OIDC for simplicity
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy with workload identity
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./app
